<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Get CamGrader | CamGrader</title>
  <meta name="description" content="Get CamGrader on your phone.">
  <link rel="canonical" href="https://camgrader.com/get">
  <meta name="robots" content="noindex">

  <link rel="apple-touch-icon" sizes="180x180" href="../images/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="../images/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="../images/favicon-16x16.png">
  <link rel="manifest" href="../images/site.webmanifest">

  <script src="../js/consent.js"></script>

  <link rel="stylesheet" href="../css/main.css">

  <style>
    .get-wrap {
      max-width: 480px;
      margin: 0 auto;
      padding: 96px 40px;
      text-align: center;
    }
    .get-heading {
      font-size: clamp(22px, 3vw, 30px);
      font-weight: 800;
      color: var(--text-primary);
      letter-spacing: -0.5px;
      margin-bottom: 10px;
    }
    .get-sub {
      font-size: 15px;
      color: var(--text-secondary);
      line-height: 1.6;
      margin-bottom: 28px;
    }
  </style>
</head>
<body class="util-body">

<div class="util-topbar">
  <div class="util-topbar-inner">
    <a href="../" class="util-topbar-brand">
      <img src="../images/logo.png" alt="CamGrader">
      <span class="util-topbar-name">CamGrader</span>
    </a>
    <a href="../" class="util-topbar-back">← Back to home</a>
  </div>
</div>

<div class="get-wrap">
  <h1 class="get-heading">Get CamGrader</h1>
  <p class="get-sub">Tap below to continue.</p>
  <a href="../get-camgrader" id="get-cta" class="btn btn-primary-light" style="display:none;">Continue</a>
</div>

<script src="../js/get-camgrader.js"></script>
<script>
(function () {
  'use strict';

  var platform = CamGraderStore.detectPlatform();
  var storeUrl = CamGraderStore.storeUrlFor(platform);

  if (!storeUrl) {
    // Desktop (or a phone whose store link isn't live yet) is just an
    // ordinary page navigation to the QR fallback - no native app handoff
    // is involved, so there's no reason to make anyone click first.
    window.location.replace('../get-camgrader');
    return;
  }

  // iOS and Android only hand a navigation off to their native store app
  // when it happens inside a real click/tap - a script-triggered redirect
  // on page load doesn't count, and just falls back to the store's own web
  // page in the browser instead. So here, unlike the desktop case above,
  // the button stays, and the actual navigation only ever happens from its
  // own click handler, same as the main site's "Get CamGrader" button.
  var cta = document.getElementById('get-cta');
  cta.href = storeUrl;
  cta.textContent = platform === 'ios' ? 'Download on the App Store' : 'Get it on Google Play';
  cta.style.display = 'inline-block';

  cta.addEventListener('click', function (e) {
    e.preventDefault();
    window.location.href = storeUrl;
  });
})();
</script>
</body>
</html>
